# Email verification (français)
emailVerificationSubject=Vérifier l''adresse e-mail
emailVerificationBody=Nous avons enregistré la création d''un compte {2} avec cette adresse e-mail. Si vous en êtes bien l''auteur, veuillez cliquer sur le lien ci-dessous pour vérifier votre adresse e-mail.\n\n{0}\n\nCe lien expirera dans {1} minutes. Si vous n''avez pas initié cette création de compte, vous pouvez ignorer ce message en toute sécurité.
emailVerificationBodyHtml=<p>Nous avons enregistré la création d''un compte {0} avec cette adresse e-mail. Si vous en êtes bien l''auteur, cliquez sur le bouton ci-dessous pour vérifier votre adresse e-mail.</p><p>Ce lien expirera dans {1} minutes. Si vous n''avez pas initié cette création de compte, vous pouvez ignorer ce message en toute sécurité.</p>
emailVerificationLinkTextHtml=Vérifier mon adresse e-mail

# Identity provider link (français)
identityProviderLinkSubject=Lier {0}
identityProviderLinkBody=Quelqu''un souhaite lier votre compte "{1}" avec le compte "{0}" de l''utilisateur {2}. Si cela vient de vous, cliquez sur le lien ci-dessous pour lier les comptes.\n\n{3}\n\nCe lien expirera dans {4} minutes. Si vous ne voulez pas lier les comptes, ignorez simplement ce message.
identityProviderLinkBodyHtml=<p>Quelqu''un souhaite lier votre compte <b>{1}</b> avec le compte <b>{0}</b> de l''utilisateur {2}. Si cela vient de vous, cliquez sur le bouton ci-dessous pour lier les comptes.</p><p>Ce lien expirera dans {3} minutes.</p><p>Si vous ne voulez pas lier les comptes, ignorez simplement ce message.</p>
identityProviderLinkLinkTextHtml=Lier les comptes

# Password reset (français)
passwordResetSubject=Réinitialiser le mot de passe
passwordResetBody=Nous avons enregistré une demande de réinitialisation de votre mot de passe. Si cela vient de vous, cliquez sur le lien ci-dessous pour le réinitialiser.\n\n{0}\n\nCe lien expirera dans {1} minutes. Si vous n''êtes pas à l''origine de cette demande, vous pouvez ignorer ce message en toute sécurité.
passwordResetBodyHtml=<p>Nous avons enregistré une demande de réinitialisation de votre mot de passe. Si cela vient de vous, cliquez sur le bouton ci-dessous pour le réinitialiser.</p><p>Ce lien expirera dans {0} minutes.</p><p>Si vous n''êtes pas à l''origine de cette demande, vous pouvez ignorer ce message en toute sécurité.</p>
passwordResetLinkTextHtml=Réinitialiser mon mot de passe

# Execute account actions (français)
executeActionsSubject=Validation de compte
executeActionsBody=Votre administrateur vient de demander la mise à jour de votre compte {2}. Cliquez sur le lien ci-dessous pour valider votre e-mail et mettre à jour vos informations.\n\n{0}\n\nCe lien expire dans {1} minutes. Si vous n''êtes pas à l''origine de cette requête, ignorez ce message.
executeActionsBodyHtml=<p>Votre administrateur vient de demander la mise à jour de votre compte {0}. Cliquez sur le bouton ci-dessous pour valider votre e-mail et mettre à jour vos informations.</p><p>Ce lien expire dans {1} minutes.</p><p>Si vous n''êtes pas à l''origine de cette requête, ignorez ce message. Aucun changement ne sera effectué sur votre compte.</p>
executeActionsLinkTextHtml=Valider mon compte

