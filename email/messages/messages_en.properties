# Identity provider link
identityProviderLinkSubject=Link {0}
identityProviderLinkBody=Someone wants to link your "{1}" account with the "{0}" account of user {2}. If this was you, click the link below to link accounts.\n\n{3}\n\nThis link will expire within {4} minutes. If you don''t want to link the accounts, just ignore this message.
identityProviderLinkBodyHtml=<p>Someone wants to link your <b>{1}</b> account with the <b>{0}</b> account of user {2}. If this was you, click the button below to link accounts.</p><p>This link will expire within {3} minutes.</p><p>If you don''t want to link the accounts, just ignore this message.</p>
identityProviderLinkLinkTextHtml=Link accounts

