# Execute account actions (Deutsch)
executeActionsSubject=Konto aktualisieren
executeActionsBody=Ihr Administrator hat gerade eine Aktualisierung Ihres {2}-Kontos angefordert. Klicken Sie auf den Link unten, um Ihre E-Mail-Adresse zu bestätigen und Ihre Angaben zu aktualisieren.\n\n{0}\n\nDieser Link läuft in {1} Minuten ab. Wenn Sie dies nicht erwartet haben, ignorieren Sie diese Nachricht einfach.
executeActionsBodyHtml=<p>Ihr Administrator hat gerade eine Aktualisierung Ihres {0}-Kontos angefordert. Klicken Sie auf die Schaltfläche unten, um Ihre E-Mail-Adresse zu bestätigen und Ihre Angaben zu aktualisieren.</p><p>Dieser Link läuft in {1} Minuten ab.</p><p>Wenn Sie dies nicht erwartet haben, ignorieren Sie diese Nachricht einfach. Es werden keine Änderungen an Ihrem Konto vorgenommen.</p>
executeActionsLinkTextHtml=Konto aktualisieren

