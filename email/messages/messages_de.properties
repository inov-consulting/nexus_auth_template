# Email verification (Deutsch)
emailVerificationSubject=E-Mail-Adresse bestätigen
emailVerificationBody=Mit dieser E-Mail-Adresse wurde ein {2}-Konto erstellt. Wenn Sie das waren, klicken Sie auf den Link unten, um Ihre E-Mail-Adresse zu bestätigen.\n\n{0}\n\nDieser Link läuft in {1} Minuten ab. Wenn Sie dieses Konto nicht erstellt haben, können Sie diese Nachricht ignorieren.
emailVerificationBodyHtml=<p>Mit dieser E-Mail-Adresse wurde ein {0}-Konto erstellt. Wenn Sie das waren, klicken Sie auf die Schaltfläche unten, um Ihre E-Mail-Adresse zu bestätigen.</p><p>Dieser Link läuft in {1} Minuten ab. Wenn Sie dieses Konto nicht erstellt haben, können Sie diese Nachricht ignorieren.</p>
emailVerificationLinkTextHtml=E-Mail-Adresse bestätigen

# Identity provider link (Deutsch)
identityProviderLinkSubject=Konto {0} verknüpfen
identityProviderLinkBody=Jemand möchte Ihr Konto "{1}" mit dem Konto "{0}" des Benutzers {2} verknüpfen. Wenn das Sie waren, klicken Sie auf den Link unten, um die Konten zu verknüpfen.\n\n{3}\n\nDieser Link läuft in {4} Minuten ab. Wenn Sie die Konten nicht verknüpfen möchten, ignorieren Sie diese Nachricht einfach.
identityProviderLinkBodyHtml=<p>Jemand möchte Ihr Konto <b>{1}</b> mit dem Konto <b>{0}</b> des Benutzers {2} verknüpfen. Wenn das Sie waren, klicken Sie auf die Schaltfläche unten, um die Konten zu verknüpfen.</p><p>Dieser Link läuft in {3} Minuten ab.</p><p>Wenn Sie die Konten nicht verknüpfen möchten, ignorieren Sie diese Nachricht einfach.</p>
identityProviderLinkLinkTextHtml=Konten verknüpfen

